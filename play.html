<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#efede8">
<title>Christmas Draw Party — ผู้เล่น</title>
<link rel="stylesheet" href="/style.css">
<style>
  html, body { overscroll-behavior: none; }
  .view { position: relative; z-index: 2; min-height: 100dvh; display: flex; flex-direction: column; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
  .mid { justify-content: center; align-items: center; text-align: center; gap: 14px; }
  .joincard { width: 100%; max-width: 420px; padding: 28px 22px; display: flex; flex-direction: column; gap: 14px; text-align: left; }
  .joincard h1 { font-size: 28px; color: var(--red); margin: 8px 0 4px; line-height: 1.3; }
  #code { text-transform: uppercase; letter-spacing: .3em; font-size: 26px; font-weight: 700; text-align: center; }
  .err { color: var(--red); font-size: 14px; min-height: 18px; }
  .big { color: var(--red); font-size: 26px; font-weight: 700; line-height: 1.35; }
  .emoji { font-size: 64px; animation: floaty 2.4s ease-in-out infinite; }

  /* drawing */
  .dhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
  .dprompt { color: var(--red); font-size: 20px; font-weight: 700; line-height: 1.3; }
  .dprompt small { display: block; font-size: 12px; color: var(--violet); font-weight: 400; }
  .dtime { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; flex: none; color: var(--ink); }
  .dtime.low { color: var(--red); animation: pulse 1s infinite; }
  .tbar { height: 6px; border-radius: 99px; background: rgba(120,110,150,.15); margin: 10px 0 12px; overflow: hidden; }
  .tbar > div { height: 100%; background: linear-gradient(90deg, var(--green), var(--gold), var(--red)); transition: width .25s linear; }
  .canvas-wrap { width: 100%; max-width: 560px; margin: 0 auto; aspect-ratio: 1; background: #fff; border-radius: 22px; overflow: hidden; touch-action: none; box-shadow: 0 14px 34px rgba(70,60,90,.16), inset 0 0 0 1px #fff; }
  canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  .tools { max-width: 560px; width: 100%; margin: 12px auto 0; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .colors { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; }
  .sw { aspect-ratio: 1; border-radius: 50%; border: 0; padding: 0; box-shadow: inset 0 -3px 5px rgba(0,0,0,.2), inset 0 2px 2px rgba(255,255,255,.5), 0 0 0 1px rgba(120,110,150,.2); }
  .sw.on { outline: 2px solid var(--red); outline-offset: 2px; transform: scale(1.08); }
  .sizes { display: flex; gap: 6px; }
  .tb { min-width: 44px; height: 44px; border-radius: 14px; border: 1px solid rgba(120,110,150,.2); background: rgba(255,255,255,.75); color: var(--ink); display: grid; place-items: center; font-size: 18px; padding: 0 10px; }
  .tb.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .dot { border-radius: 50%; background: currentColor; display: block; }
  .submit { width: 100%; max-width: 560px; margin: 14px auto 0; display: block; }

  /* voting */
  .ballot { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  .ballot button { border: 0; border-radius: 18px; background: #fff; padding: 6px; position: relative; box-shadow: 0 8px 20px rgba(70,60,90,.1); }
  .ballot button img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; border-radius: 12px; }
  .ballot button .no { position: absolute; top: 6px; left: 6px; color: #fff; border-radius: 99px; min-width: 28px; height: 28px; display: grid; place-items: center; font-weight: 700; background: radial-gradient(120% 140% at 30% 20%, #ff7b7f 0%, #e02634 40%, #a10e1b 100%); }
  .ballot button.on { box-shadow: 0 0 0 3px var(--red), 0 10px 24px rgba(200,23,42,.25); }
  .ballot button.on::after { content: '❤️'; position: absolute; bottom: 8px; right: 8px; font-size: 26px; }
</style>
</head>
<body class="stage-bg">
<div class="decor" id="decor"></div>

<div id="v-join" class="view mid">
  <div class="card joincard">
    <div class="eyebrow">Christmas Draw Party</div>
    <h1>เข้าร่วมเกม 🎄</h1>
    <div class="field"><label for="code">รหัสห้อง</label><input id="code" class="input" maxlength="4" autocomplete="off" placeholder="ABCD"></div>
    <div class="field"><label for="name">ชื่อของคุณ</label><input id="name" class="input" maxlength="20" autocomplete="nickname" placeholder="ชื่อเล่น"></div>
    <div class="err" id="err"></div>
    <button class="btn primary" id="join">เข้าห้อง</button>
  </div>
</div>

<div id="v-wait" class="view mid hidden">
  <div class="emoji" id="waitEmoji">⏳</div>
  <div class="big" id="waitTitle"></div>
  <div class="muted" id="waitSub"></div>
</div>

<div id="v-draw" class="view hidden">
  <div class="dhead">
    <div class="dprompt"><small id="dRound"></small><span id="dPrompt"></span></div>
    <div class="dtime" id="dTime"></div>
  </div>
  <div class="tbar"><div id="dBar"></div></div>
  <div class="canvas-wrap"><canvas id="cv" width="720" height="720"></canvas></div>
  <div class="tools">
    <div class="colors" id="colors"></div>
    <div class="row">
      <div class="sizes" id="sizes"></div>
      <div class="sizes">
        <button class="tb" id="eraser" title="ยางลบ">🧽</button>
        <button class="tb" id="undo" title="ย้อนกลับ">↶</button>
        <button class="tb" id="clear" title="ล้างทั้งหมด">🗑</button>
      </div>
    </div>
  </div>
  <button class="btn primary submit" id="send">ส่งรูปวาด ✨</button>
</div>

<div id="v-vote" class="view hidden">
  <div class="dhead">
    <div class="dprompt"><small>โหวตรูปที่ชอบที่สุด</small><span id="vPrompt"></span></div>
    <div class="dtime" id="vTime"></div>
  </div>
  <div class="ballot" id="ballot"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/ornaments.js"></script>
<script src="/play.js"></script>
</body>
</html>
